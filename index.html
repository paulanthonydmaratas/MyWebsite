<!DOCTYPE html>
<html>
<head>
    <title>PHP CRUD Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>User Management Dashboard</h2>
        <a href="create.html" class="btn-primary">Add New User</a>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <!-- Data rendered dynamically via JavaScript -->
            </tbody>
        </table>
    </div>

    <script src="db.js"></script>
    <script>
        function renderTable() {
            const users = getUsers();
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No records found.</td></tr>';
                return;
            }

            users.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHTML(user.id)}</td>
                    <td>${escapeHTML(user.name)}</td>
                    <td>${escapeHTML(user.email)}</td>
                    <td>
                        <a href="update.html?id=${user.id}" class="btn-edit">Edit</a>
                        <a href="#" class="btn-delete" onclick="handleDelete(${user.id}); return false;">Delete</a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function handleDelete(id) {
            if (confirm('Are you sure?')) {
                deleteUser(id);
                renderTable();
            }
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        document.addEventListener('DOMContentLoaded', renderTable);
    </script>
</body>
</html>
